<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="568" viewBox="20 52 1700 568" role="img" aria-labelledby="title description">
  <title id="title">Four-row ALU arithmetic chunk</title>
  <desc id="description">A four-limb ADD chunk showing binary limb values, decimal values, recursive RLC accumulation, and representative opcode selectors.</desc>

  <defs>
    <filter id="table-shadow" x="-3%" y="-10%" width="106%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f1f3f5; }
      .header { font: 650 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .cell { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6e9ed; }
      .mono { font: 500 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #e6e9ed; }
      .full-value { font: 500 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #e6e9ed; }
      .limb-index { font: 500 10px Inter, ui-sans-serif, system-ui, sans-serif; fill: #7f8793; }
      .muted { fill: #7f8793; }
      .active { font: 700 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #ffffff; }
      .grid { stroke: #343842; stroke-width: 1; }
      .body { fill: #191b22; }
      .head { fill: #292c36; }
    </style>
  </defs>

  <rect width="1740" height="620" fill="#101116"/>

  <g filter="url(#table-shadow)">
    <rect x="40" y="72" width="1660" height="334" rx="8" class="body"/>
  </g>
  <path d="M48 72 H1692 Q1700 72 1700 80 V142 H40 V80 Q40 72 48 72 Z" class="head"/>

  <g class="grid">
    <line x1="40" y1="142" x2="1700" y2="142"/>
    <line x1="40" y1="208" x2="1700" y2="208"/>
    <line x1="40" y1="274" x2="1700" y2="274"/>
    <line x1="40" y1="340" x2="1700" y2="340"/>

    <line x1="95" y1="72" x2="95" y2="406"/>
    <line x1="215" y1="72" x2="215" y2="406"/>
    <line x1="335" y1="72" x2="335" y2="406"/>
    <line x1="455" y1="72" x2="455" y2="406"/>
    <line x1="800" y1="72" x2="800" y2="406"/>
    <line x1="1145" y1="72" x2="1145" y2="406"/>
    <line x1="1490" y1="72" x2="1490" y2="406"/>
    <line x1="1560" y1="72" x2="1560" y2="406"/>
    <line x1="1630" y1="72" x2="1630" y2="406"/>
  </g>

  <text x="67.5" y="114" class="header" text-anchor="middle">Row</text>
  <text x="155" y="114" class="header" text-anchor="middle">input_a</text>
  <text x="275" y="114" class="header" text-anchor="middle">input_b</text>
  <text x="395" y="114" class="header" text-anchor="middle">output_c</text>
  <text x="627.5" y="114" class="header" text-anchor="middle">rlc_a</text>
  <text x="972.5" y="114" class="header" text-anchor="middle">rlc_b</text>
  <text x="1317.5" y="114" class="header" text-anchor="middle">rlc_c</text>
  <text x="1525" y="114" class="header" text-anchor="middle">isadd</text>
  <text x="1595" y="114" class="header" text-anchor="middle">ismul</text>
  <text x="1665" y="114" class="header" text-anchor="middle">isdiv</text>

  <!-- Limb 1 -->
  <text x="67.5" y="182" class="cell" text-anchor="middle">1</text>
  <text x="155" y="182" class="mono" text-anchor="middle">0011 (3)</text>
  <text x="275" y="182" class="mono" text-anchor="middle">0001 (1)</text>
  <text x="395" y="182" class="mono" text-anchor="middle">0100 (4)</text>
  <text x="627.5" y="182" class="mono" text-anchor="middle">RLC_a[1] = input_a[1] + r · RLC_a[2]</text>
  <text x="972.5" y="182" class="mono" text-anchor="middle">RLC_b[1] = input_b[1] + r · RLC_b[2]</text>
  <text x="1317.5" y="182" class="mono" text-anchor="middle">RLC_c[1] = output_c[1] + r · RLC_c[2]</text>
  <text x="1525" y="182" class="active" text-anchor="middle">1</text>
  <text x="1595" y="182" class="mono muted" text-anchor="middle">0</text>
  <text x="1665" y="182" class="mono muted" text-anchor="middle">0</text>

  <!-- Limb 2 -->
  <text x="67.5" y="248" class="cell" text-anchor="middle">2</text>
  <text x="155" y="248" class="mono" text-anchor="middle">0010 (2)</text>
  <text x="275" y="248" class="mono" text-anchor="middle">0011 (3)</text>
  <text x="395" y="248" class="mono" text-anchor="middle">0101 (5)</text>
  <text x="627.5" y="248" class="mono" text-anchor="middle">RLC_a[2] = input_a[2] + r · RLC_a[3]</text>
  <text x="972.5" y="248" class="mono" text-anchor="middle">RLC_b[2] = input_b[2] + r · RLC_b[3]</text>
  <text x="1317.5" y="248" class="mono" text-anchor="middle">RLC_c[2] = output_c[2] + r · RLC_c[3]</text>
  <text x="1525" y="248" class="active" text-anchor="middle">1</text>
  <text x="1595" y="248" class="mono muted" text-anchor="middle">0</text>
  <text x="1665" y="248" class="mono muted" text-anchor="middle">0</text>

  <!-- Limb 3 -->
  <text x="67.5" y="314" class="cell" text-anchor="middle">3</text>
  <text x="155" y="314" class="mono" text-anchor="middle">0001 (1)</text>
  <text x="275" y="314" class="mono" text-anchor="middle">0010 (2)</text>
  <text x="395" y="314" class="mono" text-anchor="middle">0011 (3)</text>
  <text x="627.5" y="314" class="mono" text-anchor="middle">RLC_a[3] = input_a[3] + r · RLC_a[4]</text>
  <text x="972.5" y="314" class="mono" text-anchor="middle">RLC_b[3] = input_b[3] + r · RLC_b[4]</text>
  <text x="1317.5" y="314" class="mono" text-anchor="middle">RLC_c[3] = output_c[3] + r · RLC_c[4]</text>
  <text x="1525" y="314" class="active" text-anchor="middle">1</text>
  <text x="1595" y="314" class="mono muted" text-anchor="middle">0</text>
  <text x="1665" y="314" class="mono muted" text-anchor="middle">0</text>

  <!-- Limb 4: RLC base case -->
  <text x="67.5" y="380" class="cell" text-anchor="middle">4</text>
  <text x="155" y="380" class="mono" text-anchor="middle">0100 (4)</text>
  <text x="275" y="380" class="mono" text-anchor="middle">0001 (1)</text>
  <text x="395" y="380" class="mono" text-anchor="middle">0101 (5)</text>
  <text x="627.5" y="380" class="mono" text-anchor="middle">RLC_a[4] = input_a[4] = 4</text>
  <text x="972.5" y="380" class="mono" text-anchor="middle">RLC_b[4] = input_b[4] = 1</text>
  <text x="1317.5" y="380" class="mono" text-anchor="middle">RLC_c[4] = output_c[4] = 5</text>
  <text x="1525" y="380" class="active" text-anchor="middle">1</text>
  <text x="1595" y="380" class="mono muted" text-anchor="middle">0</text>
  <text x="1665" y="380" class="mono muted" text-anchor="middle">0</text>

  <text x="40" y="442" class="header">Full Values</text>

  <text x="40" y="474" class="full-value">A =</text>
  <text x="180" y="474" class="full-value" text-anchor="middle">[00000000 … 00000100]₆₄</text>
  <text x="285" y="474" class="muted" text-anchor="middle">|</text>
  <text x="390" y="474" class="full-value" text-anchor="middle">[00000000 … 00000001]₆₄</text>
  <text x="495" y="474" class="muted" text-anchor="middle">|</text>
  <text x="600" y="474" class="full-value" text-anchor="middle">[00000000 … 00000010]₆₄</text>
  <text x="705" y="474" class="muted" text-anchor="middle">|</text>
  <text x="810" y="474" class="full-value" text-anchor="middle">[00000000 … 00000011]₆₄</text>
  <text x="180" y="492" class="limb-index" text-anchor="middle">limb 4</text>
  <text x="390" y="492" class="limb-index" text-anchor="middle">limb 3</text>
  <text x="600" y="492" class="limb-index" text-anchor="middle">limb 2</text>
  <text x="810" y="492" class="limb-index" text-anchor="middle">limb 1</text>

  <text x="40" y="524" class="full-value">B =</text>
  <text x="180" y="524" class="full-value" text-anchor="middle">[00000000 … 00000001]₆₄</text>
  <text x="285" y="524" class="muted" text-anchor="middle">|</text>
  <text x="390" y="524" class="full-value" text-anchor="middle">[00000000 … 00000010]₆₄</text>
  <text x="495" y="524" class="muted" text-anchor="middle">|</text>
  <text x="600" y="524" class="full-value" text-anchor="middle">[00000000 … 00000011]₆₄</text>
  <text x="705" y="524" class="muted" text-anchor="middle">|</text>
  <text x="810" y="524" class="full-value" text-anchor="middle">[00000000 … 00000001]₆₄</text>
  <text x="180" y="542" class="limb-index" text-anchor="middle">limb 4</text>
  <text x="390" y="542" class="limb-index" text-anchor="middle">limb 3</text>
  <text x="600" y="542" class="limb-index" text-anchor="middle">limb 2</text>
  <text x="810" y="542" class="limb-index" text-anchor="middle">limb 1</text>

  <text x="40" y="574" class="full-value">C =</text>
  <text x="180" y="574" class="full-value" text-anchor="middle">[00000000 … 00000101]₆₄</text>
  <text x="285" y="574" class="muted" text-anchor="middle">|</text>
  <text x="390" y="574" class="full-value" text-anchor="middle">[00000000 … 00000011]₆₄</text>
  <text x="495" y="574" class="muted" text-anchor="middle">|</text>
  <text x="600" y="574" class="full-value" text-anchor="middle">[00000000 … 00000101]₆₄</text>
  <text x="705" y="574" class="muted" text-anchor="middle">|</text>
  <text x="810" y="574" class="full-value" text-anchor="middle">[00000000 … 00000100]₆₄</text>
  <text x="180" y="592" class="limb-index" text-anchor="middle">limb 4</text>
  <text x="390" y="592" class="limb-index" text-anchor="middle">limb 3</text>
  <text x="600" y="592" class="limb-index" text-anchor="middle">limb 2</text>
  <text x="810" y="592" class="limb-index" text-anchor="middle">limb 1</text>
</svg>
