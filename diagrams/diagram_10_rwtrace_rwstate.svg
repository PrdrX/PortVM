<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="856" viewBox="0 0 1400 856" role="img" aria-labelledby="title description">
  <title id="title">RWTrace and RWState ordering</title>
  <desc id="description">The same five read-write entries appear in RWTrace ordered by RW counter and in RWState ordered lexicographically by tag, call ID, address, field tag, storage key, and RW counter.</desc>

  <defs>
    <filter id="table-shadow" x="-3%" y="-8%" width="106%" height="122%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f1f3f5; }
      .subtitle { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #858e9a; }
      .header { font: 650 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .cell { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6e9ed; }
      .mono { font: 500 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #e6e9ed; }
      .entry { font: 700 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #aeb5bf; }
      .muted { fill: #7f8793; }
      .active { font: 700 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #ffffff; }
      .grid { stroke: #343842; stroke-width: 1; }
      .body { fill: #191b22; }
      .head { fill: #292c36; }
    </style>
  </defs>

  <rect width="1400" height="856" fill="#101116"/>

  <!-- RWTrace: execution order -->
  <text x="40" y="42" class="title">RWTrace</text>
  <text x="1360" y="42" class="subtitle" text-anchor="end">sorted by RW counter</text>
  <g filter="url(#table-shadow)">
    <rect x="40" y="64" width="1320" height="324" rx="8" class="body"/>
  </g>
  <path d="M48 64 H1352 Q1360 64 1360 72 V128 H40 V72 Q40 64 48 64 Z" class="head"/>
  <g class="grid">
    <line x1="40" y1="128" x2="1360" y2="128"/>
    <line x1="40" y1="180" x2="1360" y2="180"/>
    <line x1="40" y1="232" x2="1360" y2="232"/>
    <line x1="40" y1="284" x2="1360" y2="284"/>
    <line x1="40" y1="336" x2="1360" y2="336"/>

    <line x1="110" y1="64" x2="110" y2="388"/>
    <line x1="230" y1="64" x2="230" y2="388"/>
    <line x1="350" y1="64" x2="350" y2="388"/>
    <line x1="490" y1="64" x2="490" y2="388"/>
    <line x1="620" y1="64" x2="620" y2="388"/>
    <line x1="780" y1="64" x2="780" y2="388"/>
    <line x1="940" y1="64" x2="940" y2="388"/>
    <line x1="1060" y1="64" x2="1060" y2="388"/>
  </g>

  <text x="75" y="104" class="header" text-anchor="middle">Entry</text>
  <text x="170" y="104" class="header" text-anchor="middle">Tag</text>
  <text x="290" y="104" class="header" text-anchor="middle">Call ID</text>
  <text x="420" y="104" class="header" text-anchor="middle">Address</text>
  <text x="555" y="104" class="header" text-anchor="middle">Field tag</text>
  <text x="700" y="104" class="header" text-anchor="middle">Storage key</text>
  <text x="860" y="104" class="header" text-anchor="middle">RW counter</text>
  <text x="1000" y="104" class="header" text-anchor="middle">iswrite</text>
  <text x="1210" y="104" class="header" text-anchor="middle">Value</text>

  <text x="75" y="162" class="entry" text-anchor="middle">A</text>
  <text x="170" y="162" class="cell" text-anchor="middle">2 (stack)</text>
  <text x="290" y="162" class="cell" text-anchor="middle">1</text>
  <text x="420" y="162" class="cell" text-anchor="middle">3</text>
  <text x="555" y="162" class="cell" text-anchor="middle">0</text>
  <text x="700" y="162" class="cell" text-anchor="middle">0</text>
  <text x="860" y="162" class="cell" text-anchor="middle">0</text>
  <text x="1000" y="162" class="active" text-anchor="middle">1</text>
  <text x="1210" y="162" class="mono" text-anchor="middle">9</text>

  <text x="75" y="214" class="entry" text-anchor="middle">B</text>
  <text x="170" y="214" class="cell" text-anchor="middle">1 (memory)</text>
  <text x="290" y="214" class="cell" text-anchor="middle">1</text>
  <text x="420" y="214" class="cell" text-anchor="middle">64</text>
  <text x="555" y="214" class="cell" text-anchor="middle">0</text>
  <text x="700" y="214" class="cell" text-anchor="middle">0</text>
  <text x="860" y="214" class="cell" text-anchor="middle">1</text>
  <text x="1000" y="214" class="active" text-anchor="middle">1</text>
  <text x="1210" y="214" class="mono" text-anchor="middle">165</text>

  <text x="75" y="266" class="entry" text-anchor="middle">C</text>
  <text x="170" y="266" class="cell" text-anchor="middle">2 (stack)</text>
  <text x="290" y="266" class="cell" text-anchor="middle">1</text>
  <text x="420" y="266" class="cell" text-anchor="middle">2</text>
  <text x="555" y="266" class="cell" text-anchor="middle">0</text>
  <text x="700" y="266" class="cell" text-anchor="middle">0</text>
  <text x="860" y="266" class="cell" text-anchor="middle">2</text>
  <text x="1000" y="266" class="active" text-anchor="middle">1</text>
  <text x="1210" y="266" class="mono" text-anchor="middle">4</text>

  <text x="75" y="318" class="entry" text-anchor="middle">D</text>
  <text x="170" y="318" class="cell" text-anchor="middle">1 (memory)</text>
  <text x="290" y="318" class="cell" text-anchor="middle">1</text>
  <text x="420" y="318" class="cell" text-anchor="middle">65</text>
  <text x="555" y="318" class="cell" text-anchor="middle">0</text>
  <text x="700" y="318" class="cell" text-anchor="middle">0</text>
  <text x="860" y="318" class="cell" text-anchor="middle">3</text>
  <text x="1000" y="318" class="active" text-anchor="middle">1</text>
  <text x="1210" y="318" class="mono" text-anchor="middle">54</text>

  <text x="75" y="370" class="entry" text-anchor="middle">E</text>
  <text x="170" y="370" class="cell" text-anchor="middle">2 (stack)</text>
  <text x="290" y="370" class="cell" text-anchor="middle">1</text>
  <text x="420" y="370" class="cell" text-anchor="middle">3</text>
  <text x="555" y="370" class="cell" text-anchor="middle">0</text>
  <text x="700" y="370" class="cell" text-anchor="middle">0</text>
  <text x="860" y="370" class="cell" text-anchor="middle">4</text>
  <text x="1000" y="370" class="mono muted" text-anchor="middle">0</text>
  <text x="1210" y="370" class="mono" text-anchor="middle">9</text>

  <!-- RWState: canonical key order -->
  <text x="40" y="462" class="title">RWState</text>
  <text x="1360" y="462" class="subtitle" text-anchor="end">sorted by tag → call ID → address → field tag → storage key → RW counter</text>
  <g filter="url(#table-shadow)">
    <rect x="40" y="484" width="1320" height="324" rx="8" class="body"/>
  </g>
  <path d="M48 484 H1352 Q1360 484 1360 492 V548 H40 V492 Q40 484 48 484 Z" class="head"/>
  <g class="grid">
    <line x1="40" y1="548" x2="1360" y2="548"/>
    <line x1="40" y1="600" x2="1360" y2="600"/>
    <line x1="40" y1="652" x2="1360" y2="652"/>
    <line x1="40" y1="704" x2="1360" y2="704"/>
    <line x1="40" y1="756" x2="1360" y2="756"/>

    <line x1="110" y1="484" x2="110" y2="808"/>
    <line x1="230" y1="484" x2="230" y2="808"/>
    <line x1="350" y1="484" x2="350" y2="808"/>
    <line x1="490" y1="484" x2="490" y2="808"/>
    <line x1="620" y1="484" x2="620" y2="808"/>
    <line x1="780" y1="484" x2="780" y2="808"/>
    <line x1="940" y1="484" x2="940" y2="808"/>
    <line x1="1060" y1="484" x2="1060" y2="808"/>
  </g>

  <text x="75" y="524" class="header" text-anchor="middle">Entry</text>
  <text x="170" y="524" class="header" text-anchor="middle">Tag</text>
  <text x="290" y="524" class="header" text-anchor="middle">Call ID</text>
  <text x="420" y="524" class="header" text-anchor="middle">Address</text>
  <text x="555" y="524" class="header" text-anchor="middle">Field tag</text>
  <text x="700" y="524" class="header" text-anchor="middle">Storage key</text>
  <text x="860" y="524" class="header" text-anchor="middle">RW counter</text>
  <text x="1000" y="524" class="header" text-anchor="middle">iswrite</text>
  <text x="1210" y="524" class="header" text-anchor="middle">Value</text>

  <text x="75" y="582" class="entry" text-anchor="middle">B</text>
  <text x="170" y="582" class="cell" text-anchor="middle">1 (memory)</text>
  <text x="290" y="582" class="cell" text-anchor="middle">1</text>
  <text x="420" y="582" class="cell" text-anchor="middle">64</text>
  <text x="555" y="582" class="cell" text-anchor="middle">0</text>
  <text x="700" y="582" class="cell" text-anchor="middle">0</text>
  <text x="860" y="582" class="cell" text-anchor="middle">1</text>
  <text x="1000" y="582" class="active" text-anchor="middle">1</text>
  <text x="1210" y="582" class="mono" text-anchor="middle">165</text>

  <text x="75" y="634" class="entry" text-anchor="middle">D</text>
  <text x="170" y="634" class="cell" text-anchor="middle">1 (memory)</text>
  <text x="290" y="634" class="cell" text-anchor="middle">1</text>
  <text x="420" y="634" class="cell" text-anchor="middle">65</text>
  <text x="555" y="634" class="cell" text-anchor="middle">0</text>
  <text x="700" y="634" class="cell" text-anchor="middle">0</text>
  <text x="860" y="634" class="cell" text-anchor="middle">3</text>
  <text x="1000" y="634" class="active" text-anchor="middle">1</text>
  <text x="1210" y="634" class="mono" text-anchor="middle">54</text>

  <text x="75" y="686" class="entry" text-anchor="middle">C</text>
  <text x="170" y="686" class="cell" text-anchor="middle">2 (stack)</text>
  <text x="290" y="686" class="cell" text-anchor="middle">1</text>
  <text x="420" y="686" class="cell" text-anchor="middle">2</text>
  <text x="555" y="686" class="cell" text-anchor="middle">0</text>
  <text x="700" y="686" class="cell" text-anchor="middle">0</text>
  <text x="860" y="686" class="cell" text-anchor="middle">2</text>
  <text x="1000" y="686" class="active" text-anchor="middle">1</text>
  <text x="1210" y="686" class="mono" text-anchor="middle">4</text>

  <text x="75" y="738" class="entry" text-anchor="middle">A</text>
  <text x="170" y="738" class="cell" text-anchor="middle">2 (stack)</text>
  <text x="290" y="738" class="cell" text-anchor="middle">1</text>
  <text x="420" y="738" class="cell" text-anchor="middle">3</text>
  <text x="555" y="738" class="cell" text-anchor="middle">0</text>
  <text x="700" y="738" class="cell" text-anchor="middle">0</text>
  <text x="860" y="738" class="cell" text-anchor="middle">0</text>
  <text x="1000" y="738" class="active" text-anchor="middle">1</text>
  <text x="1210" y="738" class="mono" text-anchor="middle">9</text>

  <text x="75" y="790" class="entry" text-anchor="middle">E</text>
  <text x="170" y="790" class="cell" text-anchor="middle">2 (stack)</text>
  <text x="290" y="790" class="cell" text-anchor="middle">1</text>
  <text x="420" y="790" class="cell" text-anchor="middle">3</text>
  <text x="555" y="790" class="cell" text-anchor="middle">0</text>
  <text x="700" y="790" class="cell" text-anchor="middle">0</text>
  <text x="860" y="790" class="cell" text-anchor="middle">4</text>
  <text x="1000" y="790" class="mono muted" text-anchor="middle">0</text>
  <text x="1210" y="790" class="mono" text-anchor="middle">9</text>
</svg>
