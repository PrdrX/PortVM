<svg xmlns="http://www.w3.org/2000/svg" width="1275" height="514" viewBox="44 90 1275 514" role="img" aria-labelledby="title description">
  <title id="title">CPU trace example</title>
  <desc id="description">Selected CPU rows showing state columns, representative RLC columns, memory expansion, and five opcode selectors.</desc>

  <defs>
    <filter id="table-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f1f3f5; }
      .header { font: 650 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .cell { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6e9ed; }
      .mono { font: 500 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #e6e9ed; }
      .muted { fill: #7f8793; }
      .active { font: 700 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #ffffff; }
    </style>
  </defs>

