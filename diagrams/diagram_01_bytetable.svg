<svg xmlns="http://www.w3.org/2000/svg" width="1352" height="590" viewBox="44 90 1352 590" role="img" aria-labelledby="title description">
  <title id="title">ByteTable example</title>
  <desc id="description">Six ByteTable rows showing opcodes for root call ID 1 and a WRITE immediate split across four 64-bit limbs.</desc>

  <defs>
    <filter id="table-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f1f3f5; }
      .header { font: 650 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .cell { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6e9ed; }
      .mono { font: 500 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #e6e9ed; }
      .muted { fill: #7f8793; }
      .opcode { font: 700 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #e6e9ed; }
      .immediate { font: 650 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #e6e9ed; }
      .note-title { font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f1f3f5; }
      .note { font: 400 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #aab1bc; }
    </style>
  </defs>

  <rect width="1440" height="680" fill="#101116"/>

  <g filter="url(#table-shadow)">
    <rect x="64" y="110" width="1312" height="436" rx="8" fill="#191b22"/>
  </g>

  <path d="M72 110 H1368 Q1376 110 1376 118 V174 H64 V118 Q64 110 72 110 Z" fill="#292c36"/>

  <g stroke="#343842" stroke-width="1">
    <line x1="64" y1="174" x2="1376" y2="174"/>
    <line x1="64" y1="236" x2="1376" y2="236"/>
    <line x1="64" y1="298" x2="1376" y2="298"/>
    <line x1="64" y1="360" x2="1376" y2="360"/>
    <line x1="64" y1="422" x2="1376" y2="422"/>
    <line x1="64" y1="484" x2="1376" y2="484"/>
  </g>

  <g stroke="#343842" stroke-width="1">
    <line x1="144" y1="110" x2="144" y2="546"/>
    <line x1="264" y1="110" x2="264" y2="546"/>
    <line x1="354" y1="110" x2="354" y2="546"/>
    <line x1="609" y1="110" x2="609" y2="546"/>
    <line x1="864" y1="110" x2="864" y2="546"/>
    <line x1="1119" y1="110" x2="1119" y2="546"/>
  </g>

  <text x="104" y="147" class="header" text-anchor="middle">Row</text>
  <text x="204" y="147" class="header" text-anchor="middle">Call ID</text>
  <text x="309" y="147" class="header" text-anchor="middle">PC</text>
  <text x="481" y="138" class="header" text-anchor="middle">value0</text>
  <text x="481" y="158" class="header" text-anchor="middle" opacity="0.6">bits 0-63</text>
  <text x="736" y="138" class="header" text-anchor="middle">value64</text>
  <text x="736" y="158" class="header" text-anchor="middle" opacity="0.6">bits 64-127</text>
  <text x="991" y="138" class="header" text-anchor="middle">value128</text>
  <text x="991" y="158" class="header" text-anchor="middle" opacity="0.6">bits 128-191</text>
  <text x="1247" y="138" class="header" text-anchor="middle">value192</text>
  <text x="1247" y="158" class="header" text-anchor="middle" opacity="0.6">bits 192-255</text>

  <text x="104" y="212" class="cell" text-anchor="middle">0</text>
  <text x="204" y="212" class="cell" text-anchor="middle">1</text>
  <text x="309" y="212" class="cell" text-anchor="middle">0</text>
  <text x="481" y="212" class="mono" text-anchor="middle">0x00 (BEGIN_TX)</text>
  <text x="736" y="212" class="mono muted" text-anchor="middle">0</text>
  <text x="991" y="212" class="mono muted" text-anchor="middle">0</text>
  <text x="1247" y="212" class="mono muted" text-anchor="middle">0</text>

  <text x="104" y="274" class="cell" text-anchor="middle">1</text>
  <text x="204" y="274" class="cell" text-anchor="middle">1</text>
  <text x="309" y="274" class="cell" text-anchor="middle">1</text>
  <text x="481" y="274" class="opcode" text-anchor="middle">0x55 (WRITE)</text>
  <text x="736" y="274" class="mono muted" text-anchor="middle">0</text>
  <text x="991" y="274" class="mono muted" text-anchor="middle">0</text>
  <text x="1247" y="274" class="mono muted" text-anchor="middle">0</text>

  <text x="104" y="336" class="cell" text-anchor="middle">2</text>
  <text x="204" y="336" class="cell" text-anchor="middle">1</text>
  <text x="309" y="336" class="cell" text-anchor="middle">2</text>
  <text x="481" y="336" class="immediate" text-anchor="middle">101101001011...</text>
  <text x="736" y="336" class="immediate" text-anchor="middle">011010110101...</text>
  <text x="991" y="336" class="immediate" text-anchor="middle">110001011010...</text>
  <text x="1247" y="336" class="immediate" text-anchor="middle">001110100111...</text>

  <text x="104" y="398" class="cell" text-anchor="middle">3</text>
  <text x="204" y="398" class="cell" text-anchor="middle">1</text>
  <text x="309" y="398" class="cell" text-anchor="middle">3</text>
  <text x="481" y="398" class="mono" text-anchor="middle">0x01 (ADD)</text>
  <text x="736" y="398" class="mono muted" text-anchor="middle">0</text>
  <text x="991" y="398" class="mono muted" text-anchor="middle">0</text>
  <text x="1247" y="398" class="mono muted" text-anchor="middle">0</text>

  <text x="104" y="460" class="cell" text-anchor="middle">4</text>
  <text x="204" y="460" class="cell" text-anchor="middle">1</text>
  <text x="309" y="460" class="cell" text-anchor="middle">4</text>
  <text x="481" y="460" class="mono" text-anchor="middle">0x53 (MSTORE8)</text>
  <text x="736" y="460" class="mono muted" text-anchor="middle">0</text>
  <text x="991" y="460" class="mono muted" text-anchor="middle">0</text>
  <text x="1247" y="460" class="mono muted" text-anchor="middle">0</text>

  <text x="104" y="522" class="cell" text-anchor="middle">5</text>
  <text x="204" y="522" class="cell" text-anchor="middle">1</text>
  <text x="309" y="522" class="cell" text-anchor="middle">5</text>
  <text x="481" y="522" class="mono" text-anchor="middle">0xfe (END_TX)</text>
  <text x="736" y="522" class="mono muted" text-anchor="middle">0</text>
  <text x="991" y="522" class="mono muted" text-anchor="middle">0</text>
  <text x="1247" y="522" class="mono muted" text-anchor="middle">0</text>

  <text x="64" y="594" class="note-title">WRITE at PC 1</text>
  <text x="64" y="617" class="note">The following row at PC 2 supplies its 256-bit stack value, split across all four limbs.</text>
</svg>
