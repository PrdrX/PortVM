<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="584" viewBox="0 0 1400 584" role="img" aria-labelledby="title description">
  <title id="title">16-bit range lookup</title>
  <desc id="description">Value A, here forty-two, is looked up in a table containing every integer from zero through two to the power of sixteen minus one. Four such sixteen-bit values reconstruct one sixty-four-bit value.</desc>

  <defs>
    <filter id="table-shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7f8793"/>
    </marker>
    <style>
      .title { font: 700 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f1f3f5; }
      .header { font: 650 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .cell { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6e9ed; }
      .mono { font: 500 15px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #e6e9ed; }
      .active { font: 700 15px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #ffffff; }
      .muted { fill: #7f8793; }
      .formula { font: 600 17px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #e6e9ed; }
      .grid { stroke: #343842; stroke-width: 1; }
      .body { fill: #191b22; }
      .head { fill: #292c36; }
    </style>
  </defs>

  <rect width="1400" height="584" fill="#101116"/>

  <text x="40" y="42" class="title">16-bit Range Lookup</text>

  <!-- Value being checked -->
  <g filter="url(#table-shadow)">
    <rect x="120" y="210" width="320" height="124" rx="8" class="body"/>
  </g>
  <path d="M128 210 H432 Q440 210 440 218 V272 H120 V218 Q120 210 128 210 Z" class="head"/>
  <line x1="120" y1="272" x2="440" y2="272" class="grid"/>
  <text x="280" y="249" class="header" text-anchor="middle">Value A</text>
  <text x="280" y="312" class="active" text-anchor="middle">42</text>

  <!-- Lookup direction -->
  <line x1="480" y1="272" x2="650" y2="272" stroke="#7f8793" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="252" class="cell muted" text-anchor="middle">lookup</text>

  <!-- Range table -->
  <g filter="url(#table-shadow)">
    <rect x="690" y="64" width="590" height="424" rx="8" class="body"/>
  </g>
  <path d="M698 64 H1272 Q1280 64 1280 72 V128 H690 V72 Q690 64 698 64 Z" class="head"/>
  <g class="grid">
    <line x1="690" y1="128" x2="1280" y2="128"/>
    <line x1="690" y1="188" x2="1280" y2="188"/>
    <line x1="690" y1="248" x2="1280" y2="248"/>
    <line x1="690" y1="308" x2="1280" y2="308"/>
    <line x1="690" y1="368" x2="1280" y2="368"/>
    <line x1="690" y1="428" x2="1280" y2="428"/>
  </g>

  <text x="985" y="104" class="header" text-anchor="middle">Range16 table</text>
  <text x="985" y="166" class="mono" text-anchor="middle">0</text>
  <text x="985" y="226" class="mono" text-anchor="middle">1</text>
  <text x="985" y="286" class="mono muted" text-anchor="middle">...</text>
  <text x="985" y="346" class="active" text-anchor="middle">42</text>
  <text x="985" y="406" class="mono muted" text-anchor="middle">...</text>
  <text x="985" y="466" class="mono" text-anchor="middle">2¹⁶ − 1  (65,535)</text>

  <text x="700" y="548" class="formula" text-anchor="middle">Value A + Value B · 2¹⁶ + Value C · 2³² + Value D · 2⁴⁸ = one 64-bit value</text>
</svg>
